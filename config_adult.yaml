# Week 9 · Option A: the same pipeline on new data (UCI Adult income).
# Run with:  python main.py config_adult.yaml
# COMPAS keeps running with plain `python main.py` (config.yaml).

data:
  path: "data/adult_train.csv"
  target: "income_over_50k"
  sensitive_attr: "sex"                 # audited in the fairness report; never a feature
  # id: identifier; fnlwgt: census sampling weight, not a trait of the person;
  # race: second sensitive attribute, kept out of the features on purpose (see README)
  drop_columns: ["id", "fnlwgt", "race"]
  # no `benchmark`: Adult has no existing score to compare against (COMPAS has score_text)

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"
  n_jobs: 1

diagnostics:
  id_column: "id"
  numeric_text_columns: []
  placeholder_tokens: ["?"]
  placeholder_columns: ["workclass", "occupation", "native_country"]   # "?" = unknown -> real missing value
  validity_rules:
    age: {min: 17, max: 90}             # 17-year-olds are valid here (74 people)
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0}              # 99999 is the census top code: valid, not missing
    capital_loss: {min: 0}
  canonical_categories: {}              # no spelling variants in Adult
  redundant_columns: ["education"]      # same information as education_num, one to one

preprocessing:
  encoder: "target"
  scaler: "robust"
  numeric_features: ["age", "education_num", "capital_gain", "capital_loss", "hours_per_week",
                     "v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09", "v10", "v11", "v12",
                     "v13", "v14", "v15", "v16", "v17", "v18"]
  categorical_features: ["workclass", "marital_status", "occupation", "relationship", "native_country",
                         "v19", "v20", "v21", "v22", "v23", "v24", "v25"]
  # workclass/occupation missing together = people who earn > 50K half as often: the gap carries information
  mnar_indicator_sources: ["occupation"]
  random_state: 42
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

feature_selection:
  enabled: true
  min_votes: 2
  random_state: 42
  search_space:
    select__min_votes: {type: int, low: 1, high: 3}

model:
  type: "xgboost"
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    random_state: 42
    n_jobs: -1

tuning:
  enabled: true
  n_trials: 30
  n_splits: 5
  random_state: 42
  search_spaces:
    xgboost:
      model__n_estimators: {type: int, low: 50, high: 600, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      model__max_depth: {type: int, low: 1, high: 8}
      model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
      model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
      model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}

output:
  results_dir: "results/adult"
  scoreboard: "results/adult/runs.csv"

# week 9: predict the new, unlabelled people with the final refit pipeline
predict:
  path: "data/adult_new.csv"
  output_path: "predictions/adult_new_predictions.csv"
  threshold: 0.5